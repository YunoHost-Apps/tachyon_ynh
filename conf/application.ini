; Tachyon configuration file
; Generated by the YunoHost package. Options not listed here use Tachyon's defaults.

[webmail]
title = "Tachyon Webmail"
loading_description = "Tachyon"
attachment_size_limit = 25

[contacts]
enable = On
allow_sync = On
sync_interval = 20
type = "mysql"
pdo_dsn = "mysql:host=127.0.0.1;port=3306;dbname=__DB_NAME__"
pdo_user = "__DB_USER__"
pdo_password = "__DB_PWD__"

[security]
allow_admin_panel = On
admin_login = "admin"
admin_panel_key = "admin"

[admin_panel]
allow_update = Off

[login]
; Users log in with their YunoHost e-mail; this is used if they omit the domain
default_domain = "__DOMAIN__"

[logs]
enable = Off
time_zone = "__TIMEZONE__"
auth_logging = On
auth_logging_filename = "fail2ban/auth-{date:Y-m-d}.txt"

[labs]
custom_logout_link = 'https://__MAIN_DOMAIN__/yunohost/sso/?action=logout'
